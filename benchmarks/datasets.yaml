#
# Single source of truth for benchmark dataset install metadata.
# Read by:
#   - benchmarks/scripts/setup_datasets.py (download + extract)
#   - benchmarks/scripts/run_benchmark.py  (dataset-name resolution
#     happens via the adapter registry, but `dirname` overrides for
#     on-disk path quirks like the "owasp-benchmark-" prefix)
#
# Adding a new dataset:
#   1. Implement the adapter (inherit DatasetAdapter, self-register).
#   2. Add an entry here with install info.
#   No edits to run_benchmark.py or setup_datasets.py are needed.

datasets:
  secllmholmes:
    description: "SecLLMHolmes: 228 C/C++ & Python scenarios (8 CWE classes)"
    type: git
    url: "https://github.com/ai4cloudops/SecLLMHolmes"
    dirname: secllmholmes
    disk_mb: 50

  juliet:
    description: "Juliet C/C++ 1.3.1: 64K test cases across ~180 CWEs (NIST SARD)"
    type: zip
    url: "https://samate.nist.gov/SARD/downloads/test-suites/2017-10-01-juliet-test-suite-for-c-cplusplus-v1-3.zip"
    dirname: juliet
    disk_mb: 600

  owasp-java:
    description: "OWASP BenchmarkJava v1.2: ~2,740 Java test cases, 11 CWE categories (GPL-2.0)"
    type: git
    url: "https://github.com/OWASP-Benchmark/BenchmarkJava"
    dirname: owasp-benchmark-java
    disk_mb: 200

  owasp-python:
    description: "OWASP BenchmarkPython v0.1: ~1,230 Python test cases (GPL-3.0)"
    type: git
    url: "https://github.com/OWASP-Benchmark/BenchmarkPython"
    dirname: owasp-benchmark-python
    disk_mb: 80

  realvuln:
    description: "RealVuln Benchmark: real-CVE TPs + FP traps across Python web frameworks (MIT)"
    type: git
    url: "https://github.com/kolega-ai/Real-Vuln-Benchmark"
    dirname: realvuln
    disk_mb: 30

  openvuln:
    description: "OpenVuln (ZeroFalse): 58 real CodeQL alerts with human TP/FP labels, 7 Java projects (MIT)"
    type: git
    url: "https://github.com/mhsniranmanesh/ZeroFalse"
    dirname: openvuln
    disk_mb: 60

  # security-rules is in-repo (tests/fixtures/security-rules/) — no download.
  # run_benchmark resolves its path directly; listed here for discoverability.
  security-rules:
    description: "In-repo custom-rule vuln/clean fixtures (Go/PHP/JS/Python) — finding-shaped, no download"
    type: builtin
    dirname: security-rules
    disk_mb: 0

  diversevul:
    description: "DiverseVul: 349K C/C++ functions with real CVE-backed labels (150 CWEs)"
    type: gdrive
    gdrive_id: "12IWKhmLhq7qn5B_iXgn5YerOQtkH-6RG"
    filename: diversevul.json
    dirname: diversevul
    disk_mb: 2000

  castle:
    description: "CASTLE: 250 C programs (150 vulnerable / 100 clean), 25 CWEs, labelled vulnerable lines (MIT)"
    type: git
    url: "https://github.com/CASTLE-Benchmark/CASTLE-Benchmark"
    dirname: castle
    disk_mb: 10

  juliet-java:
    description: "Juliet Java 1.3: NIST SARD Java test cases with bad()/good() methods"
    type: zip
    url: "https://samate.nist.gov/SARD/downloads/test-suites/2017-10-01-juliet-test-suite-for-java-v1-3.zip"
    dirname: juliet-java
    disk_mb: 300

  # CVEfixes (Bhandari et al., PROMISE 2021): Zenodo DOI 10.5281/zenodo.4476563
  # (v1.0.8, CVEs through 2024-07-23). The record ships a multi-GB SQL dump /
  # compressed SQLite DB (see the record's Files list for the exact size);
  # it is NOT auto-downloaded. Use benchmarks/builders/cvefixes_select.py on
  # the extracted DB to select fix commits, then build a frozen alert manifest.
  cvefixes:
    description: "CVEfixes v1.0.8: CVE fix commits DB (SQLite; CC-BY 4.0) — manual download from Zenodo"
    type: manual
    url: "https://zenodo.org/records/4476563"
    instructions: "Download the CVEfixes archive from https://zenodo.org/records/4476563, extract the SQLite DB to benchmarks/datasets/cvefixes/CVEfixes.db"
    dirname: cvefixes
    disk_mb: 15000
