# OS command-injection (CWE-78 / CWE-77) family policy — C and C++.
#
# A finding is verified through evidence closure: the model supplies each fact
# value with cited evidence, decisive facts must be resolved by admissible
# evidence, and this table — not the model's own verdict string — entails
# TP/FP/NMD.
#
# The decision table is shared by every command_injection_<lang> family. It is
# the PHP table (config/policies/command_injection.yaml) with ONE deliberate
# change: command_channel has a second positive value.
#
#   SHELL_COMMAND_TEXT_PATH_FOUND   the attacker value becomes text that a
#                                   command interpreter (sh, bash, cmd.exe,
#                                   PowerShell) parses.
#   EXECUTABLE_CONTROL_PATH_FOUND   no interpreter parses the value, but it sits
#                                   in the PROGRAM position: it decides which
#                                   executable is launched.
#
# PHP's exec family always goes through a shell, so one positive state was
# enough there. In C and C++ system() and popen()
# run a shell, while the exec* family, posix_spawn* and CreateProcess launch a
# program directly with an argument vector or command line. Attacker control of
# the program in such a launch needs its own positive state.
#
# neutralization_coverage is judged for the channel that was found, and has an
# exact meaning for each:
#   shell text        BYPASS = a witnessed command-control sequence survives;
#                     ALL_REACHING_PATHS = every path constrains every attacker
#                     value against shell control AND program-level meaning.
#   program position  BYPASS = a witnessed path on which the value is not
#                     restricted to a fixed set of programs;
#                     ALL_REACHING_PATHS = every path admits it only by exact
#                     membership in a fixed set, and the other attacker values
#                     are bounded data operands.
# Coverage dismisses only together with a PROVEN positive channel. With
# command_channel unresolved it dismisses nothing, so "there is no shell,
# therefore everything is neutralized" can never produce a False Positive.
#
# Kept limit: pure argument injection (CWE-88) — the attacker controls only an
# option or argument of a fixed program and no shell is involved — proves
# neither positive channel nor the strong fixed-executable/data-operand state.
# command_channel stays unresolved and the finding ends as Needs More Data,
# exactly as in the PHP family.
#
# production_scope is recorded but NOT decisive.
#
# One file for both languages (languages: [c, cpp]): the sinks are the same libc /
# POSIX / Win32 calls. Selection is by CWE. The scanner inventory has two rules
# carrying CWE-78 or CWE-77 for C and C++ — CodeQL cpp/command-line-injection
# (CWE-78, CWE-88) and the custom cpp/command-injection query (CWE-77, CWE-78) —
# and both flag command launches. No memory-safety rule carries either CWE, and no
# other family selects CWE-88.

family: command_injection_cpp
version: "1"

selectors:
  languages: [c, cpp]
  cwes: ["CWE-78", "CWE-77"]

fact_slots:
  sink_binding: [QUALIFYING_OS_COMMAND_SINK, NOT_OS_COMMAND_SINK]
  attacker_control: [PROVEN, REFUTED]
  flow_to_sink: [REACHES, NO_PATH_COMPLETE]
  command_channel:
    - SHELL_COMMAND_TEXT_PATH_FOUND
    - EXECUTABLE_CONTROL_PATH_FOUND
    - FIXED_EXEC_DATA_OPERANDS_ONLY_ALL_PATHS
  neutralization_coverage: [BYPASS_PATH_FOUND, ALL_REACHING_PATHS]
  production_scope: [PROD, TEST_ONLY, EXAMPLE_DEV, GENERATED_VENDOR, UNKNOWN]

decisive_slots:
  - sink_binding
  - attacker_control
  - flow_to_sink
  - command_channel
  - neutralization_coverage

entailment:
  true_positive:
    sink_binding: QUALIFYING_OS_COMMAND_SINK
    attacker_control: PROVEN
    flow_to_sink: REACHES
    # A list means "any of": either positive channel, plus a witnessed bypass.
    command_channel: [SHELL_COMMAND_TEXT_PATH_FOUND, EXECUTABLE_CONTROL_PATH_FOUND]
    neutralization_coverage: BYPASS_PATH_FOUND
  false_positive_if_any:
    - sink_binding: NOT_OS_COMMAND_SINK
    - attacker_control: REFUTED
    - flow_to_sink: NO_PATH_COMPLETE
    - command_channel: FIXED_EXEC_DATA_OPERANDS_ONLY_ALL_PATHS
    # Coverage dismisses only a PROVEN positive channel. With command_channel
    # unresolved (argument injection) it must not dismiss vacuously.
    - command_channel: [SHELL_COMMAND_TEXT_PATH_FOUND, EXECUTABLE_CONTROL_PATH_FOUND]
      neutralization_coverage: ALL_REACHING_PATHS

# Evidence-shape profile required to admit each (slot, value) — see
# verification/policy/support.py. A positive channel and a bypass are proven by a
# concrete witnessed path. The two all-path states use LOCAL_OR_EXHAUSTIVE, not
# EXHAUSTIVE_ENCODER: a fixed executable with bounded operands, an executable
# allowlist, or a complete neutralizer is proven by locally visible code.
admissibility:
  sink_binding:
    QUALIFYING_OS_COMMAND_SINK: LOCAL_POSITIVE
    NOT_OS_COMMAND_SINK: LOCAL_POSITIVE
  attacker_control:
    PROVEN: LOCAL_OR_DATAFLOW
    REFUTED: LOCAL_POSITIVE
  flow_to_sink:
    REACHES: LOCAL_OR_DATAFLOW
    NO_PATH_COMPLETE: LOCAL_OR_COMPLETE_ABSENCE
  command_channel:
    SHELL_COMMAND_TEXT_PATH_FOUND: CONCRETE_PATH
    EXECUTABLE_CONTROL_PATH_FOUND: CONCRETE_PATH
    FIXED_EXEC_DATA_OPERANDS_ONLY_ALL_PATHS: LOCAL_OR_EXHAUSTIVE
  neutralization_coverage:
    BYPASS_PATH_FOUND: CONCRETE_PATH
    ALL_REACHING_PATHS: LOCAL_OR_EXHAUSTIVE
  production_scope:
    PROD: ANY_CITATION
    TEST_ONLY: ANY_CITATION
    EXAMPLE_DEV: ANY_CITATION
    GENERATED_VENDOR: ANY_CITATION
    UNKNOWN: ANY_CITATION

# Neutral fact-gathering guidance (no verdict commands, no benchmark names).
assessment_guidance:
  - "sink_binding: QUALIFYING_OS_COMMAND_SINK when the flagged call starts an operating-system process or hands a string to a shell: system(), popen() (and the Windows _popen / _wpopen / _wsystem), the exec family (execl, execlp, execle, execv, execvp, execvpe, execve, fexecve), posix_spawn / posix_spawnp, wordexp() called without WRDE_NOCMD (it performs command substitution through a shell), or the Win32 CreateProcess* / WinExec / ShellExecute* calls. NOT_OS_COMMAND_SINK when the local slice shows the call is not a process launch: a function or method that merely shares a name (a database exec such as sqlite3_exec, a class member named system or exec), or a command string that is built or printed but never passed to a launch. When the flagged call is a wrapper or helper whose body is not in evidence, neither value is established: request the body and leave sink_binding UNRESOLVED if it cannot be retrieved."
  - "attacker_control: PROVEN when a value supplied from outside the program reaches the program path, the argument vector or the command string. The scanner data-flow SOURCE establishes this (recv / recvfrom / read on a socket, fgets / fread / fscanf / getline on a file or standard input, getenv, the argv of main, a CGI variable, a message or RPC payload), and so does the same origin shown in the local slice. Copying or formatting the value (strcpy, strcat, strncat, sprintf, snprintf, std::string concatenation, a stream insertion) does not remove external control. Judge the value that actually reaches the launch after its last assignment: an external value that is overwritten by a constant, or that only selects between constants, does not reach it. REFUTED when the local slice shows that the program and every part of the command or argument vector are constants, or are derived only from constants. A value whose origin lies in code not in evidence (a field, a getter, a parameter with no visible caller) establishes neither value: request the origin and leave attacker_control UNRESOLVED if it cannot be retrieved."
  - "flow_to_sink: REACHES when the controlled value reaches the launched command (the program, the argument vector or the command string) on some path shown by the scanner data flow or the local slice; NO_PATH_COMPLETE only with complete evidence that no path carries it there. A path that passes through code not in evidence establishes neither value."
  - "command_channel: determine how the attacker value is handed to the process launch. system(s) runs '/bin/sh -c s' on POSIX and the command interpreter (cmd.exe) on Windows; popen(s, mode) passes s to the shell in the same way; wordexp() without WRDE_NOCMD runs '$(...)' and backtick substitutions found in its input. The exec family and posix_spawn* run NO shell: the path / file parameter is the program (the p variants search PATH) and the argv entries are passed as given; argv[0] is only the name reported to the child, not the program that runs. CreateProcess runs no shell either: lpApplicationName is the program, and when it is NULL the first whitespace-delimited token of lpCommandLine is; the rest of the command line is parsed by the target program. SHELL_COMMAND_TEXT_PATH_FOUND when, on some reaching path, the attacker value becomes part of a string given to system / popen (built with sprintf, snprintf, strcat, strncat, std::string or a stream), part of the input of wordexp without WRDE_NOCMD, or part of the command string of an explicit interpreter launch (execl(\"/bin/sh\", \"sh\", \"-c\", S, ...), a CreateProcess command line starting 'cmd /c'). EXECUTABLE_CONTROL_PATH_FOUND when no interpreter parses the value but, on some reaching path, it is in the program position: the path / file parameter of an exec or posix_spawn call, lpApplicationName, the beginning of lpCommandLine when lpApplicationName is NULL, or lpFile of ShellExecute. An attacker value passed only as a later argv entry of a fixed program establishes neither positive value. When both a shell-text path and a program-position path exist, report SHELL_COMMAND_TEXT_PATH_FOUND. FIXED_EXEC_DATA_OPERANDS_ONLY_ALL_PATHS only when, on EVERY reaching path, all of these hold: no command interpreter parses the value; the program is a fixed literal, or is picked by the code from a fixed set of literals so that the attacker value is never itself used as the program; and each attacker value is a bounded DATA operand that cannot be parsed as an option, flag, subcommand, executable or interpreter input — a strict local allowlist, an enum or a numeric conversion establishes this, and 'the value is a separate argument element' does NOT. If the attacker value can only add or alter options or arguments of a fixed program and no shell is involved (argument injection, CWE-88), or the launched program's argument semantics are unknown, no value of this slot is established: leave command_channel UNRESOLVED."
  - "neutralization_coverage: judged for the channel that was found, over every path on which the attacker value reaches the launch. (a) Shell-text path: identify the position of each attacker value in the command text and its possible content after the last transformation. BYPASS_PATH_FOUND requires a WITNESSED command-control sequence on a reaching path — a separator followed by attacker command text (';', '&', '&&', '||', a newline), a command substitution ('$(...)', backticks), a pipe to an attacker command, or a redirection — that no effective neutralizer removes. This includes a reaching path with no neutralizer at all, and a blacklist or replace that misses any control character the interpreter honours. ALL_REACHING_PATHS only when every reaching path constrains every attacker value against BOTH shell control AND program-level meaning, so that each is a bounded data operand that cannot act as an option, flag, subcommand, executable or interpreter input. (b) Program-position path: BYPASS_PATH_FOUND requires a witnessed reaching path on which the value used as the program is not restricted to a fixed set of programs — there is no comparison against a fixed set, or the check still lets a different program be named (a blacklist, a suffix, extension or prefix test, a directory prefix without canonicalisation). ALL_REACHING_PATHS only when every reaching path admits the value only by exact membership in a fixed set of literals (equality, a set or map lookup, an enum, a switch) AND every other attacker value in the same launch is a bounded data operand. The absence of a shell is NOT coverage, and shell quoting is NOT coverage for a program-position value. In both cases a defense on a sibling branch does not cover the flagged branch, and a validator, helper or wrapper whose body is not in evidence establishes neither value: request it and leave neutralization_coverage UNRESOLVED if it cannot be retrieved. C and C++ specifics: the C library has no shell-quoting function, so a hand-written filter must be read in full. A filter that rejects some characters (strchr / strpbrk / strcspn against a list) is a blacklist and must cover every control character of the shell, including newline. A whitelist loop bounds the value only when it visits every byte up to the terminator and stops the launch on the first disallowed byte. Truncation by a fixed-size snprintf or strncpy is not neutralization. strtol / strtoul with the end pointer checked and the NUMBER re-formatted into the command (%d, %ld), atoi with the number re-formatted, or a strcmp match against constant strings bound the value; validating a buffer and then using a different or later-modified buffer does not."
