# Path-access / path-traversal (CWE-22 / CWE-23 / CWE-36) family policy — Go.
#
# A finding is verified through evidence closure: the model supplies each fact
# value with cited evidence, decisive facts must be resolved by admissible
# evidence, and this table — not the model's own verdict string — entails
# TP/FP/NMD.
#
# Decisive facts. A True Positive needs ALL of: the flagged call is a filesystem
# path access (sink_binding); a value from outside the trust boundary
# (attacker_control) reaches its path argument (flow_to_path); the way the path
# is CONSTRUCTED lets that value name a location outside the intended base
# (path_escape); a witnessed reaching path carries no effective confinement
# (defense_coverage); and the access has a real consequence (security_effect).
# "No sanitizer visible" alone is therefore never sufficient. Any one proven
# safe fact dismisses: not a path access, no attacker control, no flow, a
# construction that cannot leave the base, an effective guard on EVERY reaching
# path, or an inert outcome. production_scope is recorded but not decisive.
#
# Scope. The decision table is the PHP path_access table with two documented
# differences, shared by every path_access_<lang> file:
#   1. No handoff_from / applicability block. This family is selected as the
#      primary owner, so sink_binding NOT_PATH_ACCESS_SINK is a False Positive
#      condition here; in the PHP family the same value is a not-applicable
#      handoff outcome that returns the finding to its base route.
#   2. defense_coverage ALL_REACHING_PATHS is admitted by LOCAL_OR_EXHAUSTIVE
#      instead of EXHAUSTIVE_ENCODER: a canonicalise-then-containment check is
#      visible in the local slice and is not an encoder.
# Archive extraction ("zip slip" / "tar slip") joins this family: the rules are
# tagged CWE-22, so the CWE selector claims them and there is no negative
# selector. An archive entry name used to build the extraction path is a
# path-access sink; attacker control is established by the ARCHIVE being
# untrusted, and confinement is the same canonicalise-and-contain test.
# Facts that live outside retrievable code (container resource resolution,
# deployment sandboxing, interpreter or framework version defaults) are left
# unresolved and end as Needs More Data.
#
# Selectors. CWE-22, CWE-23 and CWE-36 are the path-traversal CWEs.
# CWE-73 is not selected: in the rule inventory the only Go rule carrying it is
# go/path-injection, which CWE-22 already claims, so the selector would add
# nothing. The CWE-22 selector also claims go/zipslip,
# path-traversal-inside-zip-extraction and go/unsafe-unzip-symlink (archive
# extraction, covered by the archive guidance) and filepath-clean-misuse (an
# audit rule on filepath.Clean used as a sanitiser, covered by the
# defense_coverage guidance). The CodeQL ids are also listed as aliases so a
# result without CWE tags is still routed.

family: path_access_go
version: "1"

selectors:
  languages: [go]
  cwes: ["CWE-22", "CWE-23", "CWE-36"]
  rule_aliases:
    - "go/path-injection"
    - "go/zipslip"
    - "go/unsafe-unzip-symlink"

fact_slots:
  sink_binding: [QUALIFYING_PATH_ACCESS_SINK, NOT_PATH_ACCESS_SINK]
  attacker_control: [PROVEN, REFUTED]
  flow_to_path: [REACHES, NO_PATH_COMPLETE]
  path_escape: [ESCAPE_PATH_FOUND, CONFINED_ALL_PATHS]
  defense_coverage: [BYPASS_PATH_FOUND, ALL_REACHING_PATHS]
  security_effect: [SECURITY_RELEVANT_EFFECT, NO_SECURITY_EFFECT]
  production_scope: [PROD, TEST_ONLY, EXAMPLE_DEV, GENERATED_VENDOR, UNKNOWN]

decisive_slots:
  - sink_binding
  - attacker_control
  - flow_to_path
  - path_escape
  - defense_coverage
  - security_effect

entailment:
  true_positive:
    sink_binding: QUALIFYING_PATH_ACCESS_SINK
    attacker_control: PROVEN
    flow_to_path: REACHES
    path_escape: ESCAPE_PATH_FOUND
    defense_coverage: BYPASS_PATH_FOUND
    security_effect: SECURITY_RELEVANT_EFFECT
  false_positive_if_any:
    # This family is the PRIMARY owner (selected by CWE, no handoff_from and no
    # applicability gate), so a flagged call that is provably not a filesystem
    # path access is dismissed here, as the SQL and command families do.
    - sink_binding: NOT_PATH_ACCESS_SINK
    - attacker_control: REFUTED
    - flow_to_path: NO_PATH_COMPLETE
    - path_escape: CONFINED_ALL_PATHS
    - defense_coverage: ALL_REACHING_PATHS
    - security_effect: NO_SECURITY_EFFECT

# Evidence-shape profile required to admit each (slot, value) — see
# verification/policy/support.py PROFILE_NAMES. No NONE_FOUND_COMPLETE: a
# concrete escaping path proves the positive case, otherwise the finding stays
# Needs More Data. defense_coverage ALL_REACHING_PATHS uses LOCAL_OR_EXHAUSTIVE,
# NOT EXHAUSTIVE_ENCODER (the PHP family's choice): a canonicalise-then-prefix
# check is proven by locally visible code and is not an encoder.
admissibility:
  sink_binding:
    QUALIFYING_PATH_ACCESS_SINK: LOCAL_POSITIVE
    NOT_PATH_ACCESS_SINK: LOCAL_POSITIVE
  attacker_control:
    PROVEN: LOCAL_OR_DATAFLOW
    REFUTED: LOCAL_POSITIVE
  flow_to_path:
    REACHES: LOCAL_OR_DATAFLOW
    NO_PATH_COMPLETE: LOCAL_OR_COMPLETE_ABSENCE
  path_escape:
    ESCAPE_PATH_FOUND: CONCRETE_PATH
    CONFINED_ALL_PATHS: LOCAL_OR_EXHAUSTIVE
  defense_coverage:
    BYPASS_PATH_FOUND: CONCRETE_PATH
    ALL_REACHING_PATHS: LOCAL_OR_EXHAUSTIVE
  security_effect:
    SECURITY_RELEVANT_EFFECT: LOCAL_OR_DATAFLOW
    NO_SECURITY_EFFECT: LOCAL_POSITIVE
  production_scope:
    PROD: ANY_CITATION
    TEST_ONLY: ANY_CITATION
    EXAMPLE_DEV: ANY_CITATION
    GENERATED_VENDOR: ANY_CITATION
    UNKNOWN: ANY_CITATION

# Neutral fact-gathering guidance (no verdict commands, no benchmark names).
assessment_guidance:
  - "sink_binding: QUALIFYING_PATH_ACCESS_SINK when the flagged call interprets its argument as a filesystem path and opens, reads, writes, lists, deletes, moves or serves it, or builds the path that such a call then uses: os.Open / os.OpenFile / os.ReadFile / os.WriteFile / os.Create / os.Remove / os.RemoveAll / os.Rename / os.Mkdir / os.MkdirAll / os.ReadDir; the deprecated ioutil.ReadFile / ioutil.WriteFile / ioutil.ReadDir; http.ServeFile and framework responders that wrap it (gin c.File / c.FileAttachment, echo c.File / c.Attachment, fiber c.SendFile / c.Download); gin c.SaveUploadedFile(file, dst); filepath.Join / path.Join / filepath.Clean results that feed one of these. An archive entry name used to build the path an extracted entry is written to is such a sink: archive/zip File.Name and archive/tar Header.Name (and Header.Linkname for link entries) joined into a destination path that is then created with os.Create, os.OpenFile, os.MkdirAll or os.Symlink. NOT_PATH_ACCESS_SINK only when the flagged expression is visibly not a filesystem path access and does not feed one: a pure string operation, a log call, an HTTP client request, a database key, a command execution, or a user-defined function that merely shares a name with a file API. A path-building call (filepath.Join, path.Join, filepath.Clean) whose result is not shown reaching a file operation establishes neither value: leave sink_binding unresolved and request the consumer."
  - "attacker_control: PROVEN when a value from outside the trust boundary supplies the path or part of it: r.URL.Query().Get, r.FormValue / r.PostFormValue, r.URL.Path, r.Header.Get, r.Cookie, r.PathValue, gorilla mux.Vars(r), chi.URLParam, gin c.Param / c.Query / c.PostForm, echo c.Param / c.QueryParam / c.FormValue, a client-supplied upload name (multipart.FileHeader.Filename), request bodies decoded into structs, socket or message payloads. The scanner data-flow SOURCE establishes this when it is a remote or request source. For an archive-extraction finding the scanner flow starts at the entry name and does not show where the archive comes from: PROVEN then needs evidence that the ARCHIVE is untrusted (an uploaded multipart file, a downloaded file, a request body, or a file chosen by a user of the service). REFUTED when the path is a fixed constant, is built only from constants and server-side configuration, comes only from operator input (command-line arguments, environment variables or configuration files of the deploying operator), or the archive is a fixed resource shipped with the application. A method parameter whose callers are not in evidence establishes neither value: leave attacker_control unresolved and request the callers."
  - "flow_to_path: REACHES when the controlled value, or a value derived from it by concatenation, joining, decoding or formatting, reaches the path argument of the file operation on some path — the scanner data-flow steps or the local slice show it. For an archive finding the value is the entry name and the path is the extraction target. NO_PATH_COMPLETE only with complete evidence that no path carries the value there (it is overwritten by a constant on every path before use, or the flagged statement cannot execute with an attacker value). Not seeing the flow is not NO_PATH_COMPLETE: leave flow_to_path unresolved and request the missing function."
  - "path_escape: decide from how the path is CONSTRUCTED which part of it the attacker value occupies and whether that construction lets it leave the intended base directory. ESCAPE_PATH_FOUND when a witnessed reaching path lets the value name a location outside the base: the value is the whole path, or it is joined after a base and may contain a separator or a parent-directory segment, or the joining call lets an absolute value replace the base. filepath.Join(base, value) concatenates and then applies filepath.Clean: an absolute value does not replace the base, but '..' segments in value climb out of it (Join of /srv/data and ../../etc/passwd is /etc/passwd); filepath.Clean is lexical and keeps leading '..' in a relative path; string concatenation base + value and fmt.Sprintf permit '..'; a value used as the entire argument of os.Open or http.ServeFile names any path. path.* functions treat only '/' as a separator, filepath.* use the host separator. An archive entry name is text chosen by whoever built the archive and may be absolute or contain '..': filepath.Join(dest, f.Name) climbs out through '..'. A link entry (tar.TypeSymlink / tar.TypeLink, or a zip entry whose mode has os.ModeSymlink) creates a link to an archive-chosen target, and a later entry written through that link lands at the link target. CONFINED_ALL_PATHS only when, on EVERY reaching path, the value cannot change the directory: it only selects among a fixed set of names (a lookup in a constant map, enum or switch), it is converted to a type that cannot hold a separator or a dot segment, or it is reduced to one filename segment that is neither '.' nor '..' and then joined to a fixed base. filepath.Base(value) keeps the last element and still returns '..' for a value whose last segment is '..' (and '.' for an empty string); strconv.Atoi / strconv.ParseInt and uuid.Parse conversions cannot carry a separator. This slot describes the construction; a canonicalise-and-compare guard that rejects the request is assessed under defense_coverage. When the base directory is itself attacker-influenced, or the path is built in a helper that is not in evidence, leave path_escape unresolved and request the helper."
  - "defense_coverage: BYPASS_PATH_FOUND when, on a witnessed reaching path (the local slice or the scanner data-flow steps), the value reaches the file operation with no guard, or only with one that does not confine it — name the input that still escapes. Guards that do not confine: filepath.Clean(value) or filepath.Join with no containment test on the result — cleaning is not confinement, which is what a clean-misuse finding points at; strings.HasPrefix(abs, base) without a trailing separator, which also admits sibling directories (/srv/data-evil for base /srv/data); a containment test on the raw value before joining; strings.ReplaceAll(value, '../', ''), which re-forms it from '....//'; a test performed before url.QueryUnescape / url.PathUnescape or another decode. http.ServeFile refuses a request whose r.URL.Path contains a '..' element, which covers only a name taken from r.URL.Path: it does not inspect a name built from a query parameter, form field, header or route variable. A reject-if-contains '..' test is a blocklist, not canonical confinement: it leaves absolute values wherever the join lets one replace the base, values decoded or normalised again after the test, and links. It supports ALL_REACHING_PATHS only when it is applied to the final decoded value, an absolute value cannot restart the path (or is rejected too), and no later decode exists; when any of these is not visible, leave defense_coverage unresolved. Effective guards: (a) canonicalise, then contain: abs := filepath.Join(base, value) (or filepath.Abs) followed by abs == base || strings.HasPrefix(abs, base + string(os.PathSeparator)) with base absolute and cleaned, or rel, err := filepath.Rel(base, abs) with err == nil and rel neither '..' nor starting with '..' + separator; filepath.EvalSymlinks before the test when links matter; (b) confining APIs: filepath.IsLocal(value) (Go 1.20+, lexical: false for absolute, empty and '..'-escaping values) tested before joining to a fixed base; filepath.Clean('/' + value) or path.Clean('/' + value), whose rooted result cannot climb above '/', joined under a fixed base; os.Root / os.OpenInRoot (Go 1.24+), which also refuse links that leave the root; http.Dir(base).Open(name) and http.FileServer(http.Dir(base)), which clean '/' + name before joining (links inside the root are still followed); (c) a strict allowlist: the whole value compared with a fixed set, or matched against an anchored pattern that admits no separator and no dot-only segment; (d) reduction to one filename segment as described under path_escape. For archive extraction the same test applies to each entry before it is written: the joined target must equal the cleaned destination or start with it plus the separator. A lexical test on entry names does not cover a write through a previously extracted link: coverage of link entries needs the link target confined as well, link entries refused, or filepath.EvalSymlinks applied to the parent directory before the test. A guard on a sibling branch, a guard whose result is ignored, a guard that only logs, or a guard applied to a different variable than the one used at the file operation does not cover the flagged path. An extension or suffix test constrains the file type, not the directory. ALL_REACHING_PATHS only when EVERY reaching path applies an effective guard before the file operation and a failed test prevents the access (throw, return, reject); one unguarded branch is BYPASS_PATH_FOUND. When the value passes through a validator, wrapper, filter or framework hook whose body is not in evidence, or confinement would depend on deployment facts the code does not show (chroot, container volume, filesystem permissions, sandboxing), assert neither value: leave defense_coverage unresolved and request the helper."
  - "security_effect: SECURITY_RELEVANT_EFFECT when the access at the escaped location has a real consequence shown in evidence: file content is returned, served, rendered or otherwise disclosed to the requester; a file or directory is created, overwritten, appended to, deleted, moved or re-permissioned at an attacker-chosen location (writing an extracted archive entry is such a write); or a directory listing is disclosed. NO_SECURITY_EFFECT when the outcome is visibly inert: the path is computed or logged but never used for a file operation, or the only operation is an existence or metadata test whose result is neither disclosed nor used to gate anything. When the consumer of the path or of the file content is not in evidence, leave security_effect unresolved and request it."
