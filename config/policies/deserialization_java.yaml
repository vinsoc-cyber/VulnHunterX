#
# Unsafe deserialization (CWE-502) family policy — Java.
#
# A finding is verified through evidence closure: the model supplies each fact
# value with cited evidence, decisive facts must be resolved by admissible
# evidence, and this table — not the model's own verdict string — entails
# TP/FP/NMD.
#
# CWE-502 is about attacker-controlled bytes/text being decoded by a mechanism
# that can instantiate attacker-chosen types or invoke code while decoding. Two
# DISTINCT defensive facts decide it and must not be collapsed:
# deserializer_capability (can the decoding API, as configured on the reaching
# path, materialize attacker-named types — native Java serialization, XMLDecoder,
# polymorphic Jackson, SnakeYAML's default Constructor — or is it a data-only
# decoder on every path) and type_restriction (for a decoder that CAN, is an
# effective type allowlist applied to that stream on every reaching path).
# A cast of the decoded result is not a restriction: the object graph is built
# before the cast runs.
#
# Integrity protection is deliberately NOT a slot. A payload authenticated with a
# server-side secret before decoding is not attacker-controlled, so it is decided
# by attacker_control, and only when the verification is visible on every path.
#
# Several capabilities depend on the library VERSION (XStream 1.4.18 default
# allowlist, SnakeYAML 2.x global-tag restriction, Kryo 5 registration, fastjson
# autoType) or on process-wide configuration (jdk.serialFilter). Those live in
# build files and JVM configuration, not in the code slice, so they stay
# unresolved (Needs More Data) unless retrieved evidence shows them.
#
# Selection: CWE-502 is clean for Java in the rule inventory (no Java rule
# carries CWE-502 together with a CWE another family selects). The one alias
# claims the Semgrep/OpenGrep `xml-decoder` rule: it flags java.beans.XMLDecoder,
# which is a deserialization sink, but the rule is tagged CWE-611. The Java XXE
# family therefore selects by alias and leaves that rule to this family.
# The CWE selector also claims audit rules whose "sink" is a framework entry
# point (RESTEasy provider rules, RMI remote-interface rules, JMS
# ObjectMessage.getObject); the guidance classifies them rather than excluding
# them, and the facts they cannot show stay unresolved.

family: deserialization_java
version: "1"

selectors:
  languages: [java]
  cwes: ["CWE-502"]
  rule_aliases:
    - "*java.lang.security.audit.xml-decoder*"

fact_slots:
  sink_binding: [QUALIFYING_DESERIALIZATION_SINK, NOT_DESERIALIZATION_SINK]
  attacker_control: [PROVEN, REFUTED]
  flow_to_sink: [REACHES, NO_PATH_COMPLETE]
  deserializer_capability: [ARBITRARY_TYPE_PATH_FOUND, DATA_ONLY_ALL_PATHS]
  type_restriction: [BYPASS_PATH_FOUND, ALL_REACHING_PATHS]
  production_scope: [PROD, TEST_ONLY, EXAMPLE_DEV, GENERATED_VENDOR, UNKNOWN]

decisive_slots:
  - sink_binding
  - attacker_control
  - flow_to_sink
  - deserializer_capability
  - type_restriction

entailment:
  true_positive:
    sink_binding: QUALIFYING_DESERIALIZATION_SINK
    attacker_control: PROVEN
    flow_to_sink: REACHES
    deserializer_capability: ARBITRARY_TYPE_PATH_FOUND
    type_restriction: BYPASS_PATH_FOUND
  false_positive_if_any:
    - sink_binding: NOT_DESERIALIZATION_SINK
    - attacker_control: REFUTED
    - flow_to_sink: NO_PATH_COMPLETE
    - deserializer_capability: DATA_ONLY_ALL_PATHS
    # A type restriction dismisses only a PROVEN arbitrary-type decoder. For a
    # decoder whose capability is unresolved, "a filter exists" is not yet a fact
    # about this stream and must not dismiss vacuously.
    - deserializer_capability: ARBITRARY_TYPE_PATH_FOUND
      type_restriction: ALL_REACHING_PATHS

# Evidence-shape profile required to admit each (slot, value) — see
# verification/policy/support.py PROFILE_NAMES. No NONE_FOUND_COMPLETE: a concrete
# unrestricted arbitrary-type decode proves the positive case, otherwise stay
# Needs More Data. The all-paths values use LOCAL_OR_EXHAUSTIVE, NOT
# EXHAUSTIVE_ENCODER: a data-only decoder or a stream filter is proven by the
# locally visible construction of the decoder, and is not encoder coverage.
admissibility:
  sink_binding:
    QUALIFYING_DESERIALIZATION_SINK: LOCAL_POSITIVE
    NOT_DESERIALIZATION_SINK: LOCAL_POSITIVE
  attacker_control:
    PROVEN: LOCAL_OR_DATAFLOW
    REFUTED: LOCAL_POSITIVE
  flow_to_sink:
    REACHES: LOCAL_OR_DATAFLOW
    NO_PATH_COMPLETE: LOCAL_OR_COMPLETE_ABSENCE
  deserializer_capability:
    ARBITRARY_TYPE_PATH_FOUND: CONCRETE_PATH
    DATA_ONLY_ALL_PATHS: LOCAL_OR_EXHAUSTIVE
  type_restriction:
    BYPASS_PATH_FOUND: CONCRETE_PATH
    ALL_REACHING_PATHS: LOCAL_OR_EXHAUSTIVE
  production_scope:
    PROD: ANY_CITATION
    TEST_ONLY: ANY_CITATION
    EXAMPLE_DEV: ANY_CITATION
    GENERATED_VENDOR: ANY_CITATION
    UNKNOWN: ANY_CITATION

# Neutral fact-gathering guidance (no verdict commands, no benchmark names).
assessment_guidance:
  - "sink_binding: QUALIFYING_DESERIALIZATION_SINK when the flagged code decodes a serialized object graph, or declares an entry point whose arguments the runtime decodes that way: ObjectInputStream.readObject / readUnshared (including wrappers such as Apache Commons SerializationUtils.deserialize and Spring SerializationUtils.deserialize), java.beans.XMLDecoder.readObject, XStream.fromXML / unmarshal, Jackson ObjectMapper.readValue / readTree-then-treeToValue / ObjectReader.readValue, SnakeYAML Yaml.load / loadAs / loadAll, Kryo.readObject / readClassAndObject, Hessian or Burlap input readObject, fastjson JSON.parse / parseObject, a JMS ObjectMessage.getObject() call, or a java.rmi.Remote interface method whose parameters are decoded by RMI with Java serialization. NOT_DESERIALIZATION_SINK when the flagged code does none of these — it only WRITES objects (ObjectOutputStream.writeObject), reads primitives or strings from a stream (DataInputStream, ObjectInputStream.readInt / readUTF with no readObject), or is a user-defined method that merely shares a name the rule matched. For a rule that flags a JAX-RS resource for its media types (a missing or wildcard @Consumes), the flagged method is a sink only if evidence shows a provider that decodes Java-serialized or other type-carrying bodies for it; provider registration lives in framework configuration and the classpath, so when it is not in evidence leave sink_binding unresolved."
  - "attacker_control: PROVEN when the bytes or text being decoded come from outside the trust boundary — the scanner data-flow SOURCE establishes this (an HTTP request body, parameter, header or cookie; an uploaded file; a socket or other network stream; a message received from a queue or topic; the arguments of a remotely callable RMI/JMX method). REFUTED when the decoded data is a fixed constant or a resource shipped with the application, or when it is authenticated with a server-side secret BEFORE decoding: a MAC or signature over the exact bytes that are decoded (for example javax.crypto.Mac HMAC compared with MessageDigest.isEqual, or Signature.verify), computed with a key the client cannot read, checked on EVERY path that reaches the decode, with the decode skipped when the check fails. The following do NOT establish REFUTED: Base64 or hex decoding, compression, encryption without authentication, a checksum or unkeyed hash, a signature verified AFTER decoding, a verification visible on only one branch, or a key that is a hard-coded default or travels with the payload. A file path, database column or cache entry is not a trust boundary by itself; if who can write it is not in evidence, leave attacker_control unresolved."
  - "flow_to_sink: REACHES when the controlled bytes or text reach the decoding call on some path (directly, or wrapped in ByteArrayInputStream / GZIPInputStream / Base64 decoding / a Reader); NO_PATH_COMPLETE only with complete evidence that no path carries them there."
  - "deserializer_capability: decide whether the decoding API, AS CONFIGURED on the instance that decodes the attacker data, can instantiate attacker-named types or invoke code during decoding. ARBITRARY_TYPE_PATH_FOUND when some reaching path uses: ObjectInputStream.readObject / readUnshared (any Serializable class on the classpath; RMI arguments of a non-primitive, non-String declared type and JMS ObjectMessage.getObject use this mechanism); XMLDecoder (the document itself names classes and methods to call); XStream.fromXML; Kryo with setRegistrationRequired(false); Hessian / Burlap readObject; Jackson when polymorphic typing is enabled on that mapper or target type — enableDefaultTyping(...), activateDefaultTyping(...) / activateDefaultTypingAsProperty(...), or @JsonTypeInfo(use = Id.CLASS or Id.MINIMAL_CLASS) on a property or class reachable from the bound type whose declared type is Object, an interface, an abstract class or another non-final supertype; SnakeYAML Yaml.load with the default Constructor (new Yaml(), new Yaml(new Constructor(...)), including a typed root such as new Constructor(Foo.class), because nested nodes can still carry global tags) on SnakeYAML 1.x; fastjson with autoType enabled (ParserConfig.setAutoTypeSupport(true) or Feature.SupportAutoType). DATA_ONLY_ALL_PATHS only when EVERY reaching path uses a decoder that builds only the statically declared types: Jackson readValue into a concrete class, Map, List or JsonNode with no default typing on that mapper and no class-name @JsonTypeInfo in the bound type graph (readValue(x, Object.class) without default typing yields only maps, lists and scalars); Gson, org.json, JSON-B, protobuf; SnakeYAML constructed with SafeConstructor; DataInputStream-style primitive reads. Version-dependent cases must be found in evidence, not assumed: SnakeYAML 2.0+ rejects global tags under the default LoaderOptions, Kryo 5 requires class registration by default while earlier versions do not, fastjson autoType defaults changed in 1.2.25; when the mapper / Yaml / Kryo instance is created or configured outside the visible code (an injected or shared bean, a field initialised elsewhere), or the deciding library version is not in evidence, leave deserializer_capability unresolved or request the declaring class. 'The result is cast to an expected class' does NOT make a decoder data-only."
  - "type_restriction: for a decoder that can materialize attacker-named types, determine whether an effective type ALLOWLIST is applied to the SAME stream / decoder instance before or during decoding. Restrictions that count: ObjectInputStream.setObjectInputFilter(...) on that stream with a filter that rejects every class outside an explicit list (a pattern ending in '!*', or a filter returning REJECTED by default); a subclass that overrides resolveClass (and resolveProxyClass) to throw for every class outside an explicit allowlist, such as Apache Commons IO ValidatingObjectInputStream with accept(...) patterns or a look-ahead ObjectInputStream; XStream with addPermission(NoTypePermission.NONE) followed by allowTypes / allowTypesByWildcard / allowTypeHierarchy on that XStream instance; Jackson activateDefaultTyping given a BasicPolymorphicTypeValidator restricted to explicit base types or packages (LaissezFaireSubTypeValidator restricts nothing); Kryo with registration required and only expected classes registered. These do NOT count: a cast or instanceof check on the returned object; a denylist of known gadget classes; a filter that only limits depth, array length or reference count; a filter set on a different stream; validation performed after decoding. XMLDecoder has no type filter. BYPASS_PATH_FOUND requires a WITNESSED reaching path on which the decoder instance is visible and decodes without such an allowlist — for example a plain new ObjectInputStream(in) whose readObject is called with no setObjectInputFilter on it, a subclass whose resolveClass is not restrictive, or an XStream instance configured with a wildcard that admits everything. A process-wide filter (the jdk.serialFilter system property or ObjectInputFilter.Config.setSerialFilter) and the XStream 1.4.18+ default allowlist are configuration or version facts: evaluate them when evidence shows them, and do not assume them. If the stream or decoder is obtained from a factory, helper or subclass whose body is not in evidence, leave type_restriction unresolved or request that body. ALL_REACHING_PATHS only when every reaching path decodes through an allowlisting restriction; one unrestricted branch is BYPASS_PATH_FOUND."
